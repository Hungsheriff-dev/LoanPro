<div class="login-page">
    <mat-card class="login-card">
      <mat-card-header>
        <mat-card-title>LoanPro System</mat-card-title>
        <mat-card-subtitle>Đăng nhập hệ thống quản lý khoản vay</mat-card-subtitle>
      </mat-card-header>
  
      <mat-card-content>
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Username</mat-label>
            <input matInput formControlName="username" autocomplete="username" />
          </mat-form-field>
  
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input
              matInput
              type="password"
              formControlName="password"
              autocomplete="current-password"
            />
          </mat-form-field>
  
          @if (errorMessage()) {
            <div class="error">{{ errorMessage() }}</div>
          }
  
          <button
            mat-raised-button
            color="primary"
            class="full-width"
            type="submit"
            [disabled]="loading()"
          >
            @if (loading()) {
              <mat-spinner diameter="20"></mat-spinner>
            } @else {
              Đăng nhập
            }
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
